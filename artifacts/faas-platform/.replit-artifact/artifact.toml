kind = "web"
previewPath = "/"
title = "Smart Farming FaaS Platform"
version = "1.0.0"
id = "artifacts/faas-platform"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20284

[services.development]
run = "pnpm --filter @workspace/faas-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/faas-platform", "run", "build" ]
publicDir = "artifacts/faas-platform/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20284"
BASE_PATH = "/"
